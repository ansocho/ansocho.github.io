<header class="site-header">
  <nav class="nav container" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}"><strong>Andreas</strong> Sochopoulos</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
    <ul class="nav-links">
      {%- assign links = "about:/,publications:/publications/,news:/news/" | split: "," -%}
      {%- for l in links -%}
        {%- assign parts = l | split: ":" -%}
        <li><a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
      {%- endfor %}
      <li><a href="{{ '/cv' | relative_url }}">cv</a></li>
      <li><button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode" onclick="toggleTheme()">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      </button></li>
    </ul>
  </nav>
</header>
<script>
  function toggleTheme() {
    var d = document.documentElement;
    var dark = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    d.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", d.dataset.theme); } catch (e) {}
  }
</script>
