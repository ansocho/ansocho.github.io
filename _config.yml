# Site settings ---------------------------------------------------------------
title: Andreas Sochopoulos
description: >-
  Andreas Sochopoulos is a PhD student in robot learning at the University of
  Edinburgh, supported by Honda Research Institute Europe, working on imitation
  learning with diffusion and flow models.
url: https://ansocho.github.io
baseurl: ""
lang: en
timezone: Europe/London

author:
  name: Andreas Sochopoulos
  url: https://ansocho.github.io/

twitter:
  card: summary

# Used by jekyll-seo-tag for the JSON-LD "sameAs" links.
social:
  name: Andreas Sochopoulos
  links:
    - https://github.com/ansocho
    - https://www.linkedin.com/in/andreas-sochopoulos-abab5417a
    - https://scholar.google.com/citations?user=6w9786sAAAAJ

# Google Analytics 4 (only emitted when JEKYLL_ENV=production, i.e. on GitHub Pages).
google_analytics: G-R86WDB5YN5

# Google Search Console: uncomment and paste the code from the HTML-tag
# verification method (only the content="..." value). See README.
# webmaster_verifications:
#   google: PASTE-YOUR-CODE-HERE

# Build settings --------------------------------------------------------------
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "" }
    values:
      layout: default
      image: /assets/img/profile_pic.jpeg
  # Keep the CV PDF out of the sitemap (only real pages belong there).
  - scope: { path: "assets" }
    values:
      sitemap: false

exclude:
  - README.md
  - "CLAUDE*.md"
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .tweet-cache
